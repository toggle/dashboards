:root{
  --surface:#FFFFFF;--surface-2:#F7F7FA;--surface-3:#F0F0F5;--line:#DFDFE8;--line-strong:#101820;
  --ink:#101820;--ink-muted:#494950;--ink-subtle:#6D6D78;--action:#101820;--on-action:#FFFFFF;
  --pass:#16A34A;--on-pass:#101820;--pass-text:#0A7A36;--pass-soft:#E8F5EC;
  --fail:#BA0C1F;--on-fail:#FFFFFF;--fail-soft:#FCEBEB;
  --check:#FABC00;--on-check:#101820;--check-soft:#FFF4D6;
  --brand:#FB4123;--focus:#FB4123;
  --space-1:8px;--space-2:16px;--space-3:24px;--space-4:32px;--space-6:48px;--space-8:64px;
  --radius-1:4px;--target-min:64px;--target-std:80px;--target-primary:112px;--topbar-h:80px;--row-h:72px;--result-frame:32px;
  --font-sans:'Archivo','Segoe UI',system-ui,sans-serif;--font-mono:'Roboto Mono',Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2A2F36;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;touch-action:manipulation}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--surface);color:var(--ink);font-family:var(--font-sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow:hidden;display:grid;grid-template-rows:var(--topbar-h) 1fr}
#stage::after{content:"";position:absolute;inset:var(--topbar-h) 0 0 0;border:var(--result-frame) solid transparent;pointer-events:none;z-index:5}
#stage.r-pass::after{border-color:var(--pass)}#stage.r-fail::after{border-color:var(--fail)}#stage.r-check::after{border-color:var(--check)}
.mono{font-family:var(--font-mono);font-weight:500}

/* top bar */
.bar{height:var(--topbar-h);background:var(--surface-2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:var(--space-3);padding:0 var(--space-2) 0 var(--space-2);position:relative;z-index:6}
.bar .logo{height:30px}
.bar .station{font-size:22px;font-weight:600}
.bar .role{font-size:18px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:2px solid var(--ink);padding:6px 10px;border-radius:var(--radius-1)}
.bar .sp{flex:1}
.menu-btn{height:64px;min-width:140px;border:2px solid var(--line-strong);background:var(--surface);border-radius:var(--radius-1);font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 18px;cursor:pointer}
.menu-btn svg{width:26px;height:26px}
.chips{display:flex;gap:var(--space-2);height:64px;align-items:center;border:0;background:none;padding:0 8px;cursor:pointer;border-radius:var(--radius-1)}
.chip{display:inline-flex;align-items:center;gap:var(--space-1);font-size:20px;font-weight:600;height:48px;padding:0 var(--space-2);border-radius:var(--radius-1);white-space:nowrap}
.chip i{width:14px;height:14px;border-radius:50%;background:var(--pass-text);display:inline-block}
.chip.warn{background:var(--check);color:var(--on-check)}.chip.warn i{background:var(--on-check)}
.chip.down{background:var(--fail);color:var(--on-fail)}.chip.down i{background:var(--on-fail)}

/* buttons */
.btn{font-family:var(--font-sans);font-size:26px;line-height:32px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;min-height:var(--target-std);min-width:240px;padding:0 var(--space-4);border-radius:var(--radius-1);display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);cursor:pointer;border:2px solid transparent;transition:transform 60ms,opacity 60ms,background 60ms}
.btn.primary{background:var(--action);color:var(--on-action);min-height:var(--target-primary);min-width:400px;font-size:32px}
.btn.secondary{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn.destructive{background:var(--surface);color:var(--fail);border-color:var(--fail)}
.btn.sm{min-width:0;min-height:var(--target-min);font-size:22px;padding:0 24px}
.btn:active,.btn.pressed{transform:translateY(2px)}
.btn.primary:active,.btn.primary.pressed{opacity:.82}
.btn.secondary:active,.btn.secondary.pressed,.menu-btn:active,.menu-btn.pressed{background:var(--surface-3)}
.btn[disabled]{background:var(--surface-3);color:var(--ink-muted);border-color:var(--line);cursor:default;transform:none;opacity:1}
.link{font:inherit;color:var(--ink);text-decoration:underline;text-underline-offset:4px;background:none;border:0;padding:0 8px;min-height:var(--target-min);cursor:pointer;font-weight:600}
.link:active{background:var(--surface-3)}

/* shell */
#view{position:relative;min-height:0;overflow:hidden}
.body{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);height:100%}
.right{display:grid;grid-template-rows:1fr auto;min-height:0}
.evidence{padding:var(--space-8) calc(var(--space-8) + var(--result-frame)) var(--space-3) var(--space-8);display:flex;flex-direction:column;gap:var(--space-3);min-height:0}
.actions{padding:var(--space-3) calc(var(--space-6) + var(--result-frame)) calc(var(--space-6) + var(--result-frame) - 16px) var(--space-8);display:flex;justify-content:flex-end;align-items:center;gap:var(--space-3)}
.actions .info{margin-right:auto;display:flex;gap:var(--space-3)}
.title{font-size:48px;line-height:56px;font-weight:700;margin:0}
.body-lg{font-size:28px;line-height:38px;font-weight:500;margin:0}
.body-txt{font-size:22px;line-height:31px;margin:0;color:var(--ink-muted)}
.num-lg{font-size:64px;line-height:64px;font-weight:700}
.label{font-size:18px;line-height:24px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.rule{height:1px;background:var(--line);border:0;margin:0}
.context{display:grid;grid-template-columns:220px 1fr;row-gap:var(--space-2);column-gap:var(--space-3);align-items:baseline;margin:0}
.context dt{font-size:18px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.context dd{margin:0;font-size:26px;font-weight:600}
.grow{flex:1}

/* camera */
.camera{position:relative;height:100%;background:#1E2A38;display:flex;align-items:center;justify-content:center;overflow:hidden}
.camera .area{position:absolute;inset:64px;border:4px dashed #fff}
.camera .tag{position:absolute;left:32px;top:32px;background:#fff;color:var(--ink);font-size:18px;font-weight:700;letter-spacing:.06em;padding:8px 12px;text-transform:uppercase;z-index:2}
.camera .part{width:62%;height:24%;background:#8C8C98;position:relative;border-radius:2px}
.camera .part::before,.camera .part::after{content:"";position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:#1E2A38;transform:translateY(-50%)}
.camera .part::before{left:12%}.camera .part::after{right:12%}
.camera.off .part{transform:translateX(38%)}
.camera .sweep{position:absolute;top:0;bottom:0;width:120px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);left:-140px;animation:sweep 1.2s linear infinite}
@keyframes sweep{to{left:100%}}

/* verdict */
.verdict{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:var(--space-4);padding:var(--space-6);height:100%}
.verdict.pass{background:var(--pass);color:var(--on-pass)}.verdict.fail{background:var(--fail);color:var(--on-fail)}.verdict.check{background:var(--check);color:var(--on-check)}
.verdict svg{width:360px;height:360px}.verdict svg *{stroke:currentColor}
.verdict .word{font-size:200px;line-height:.9;font-weight:900;font-stretch:75%;text-transform:uppercase;margin:0}

/* callouts */
.callout{background:var(--surface-2);padding:var(--space-4);display:grid;gap:var(--space-1)}
.callout .name{font-size:28px;font-weight:600}
.callout .dev{font-size:48px;line-height:56px;font-weight:700;color:var(--fail)}
.inferred{display:inline-flex;align-items:center;height:36px;padding:0 12px;border:2px dashed var(--ink-muted);color:var(--ink-muted);border-radius:var(--radius-1);font-size:18px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.inf-line{display:flex;align-items:center;gap:var(--space-2);font-size:22px;color:var(--ink-muted)}
.why{background:var(--surface-2);padding:var(--space-3);font-size:22px;line-height:31px;color:var(--ink)}

/* progress */
.progress{display:grid;gap:var(--space-3)}
.track{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-1)}
.seg{height:20px;background:var(--surface-3)}.seg.done{background:var(--ink)}
.seg.now{background:repeating-linear-gradient(90deg,var(--ink) 0 14px,var(--surface-3) 14px 28px);background-size:28px 20px;animation:stripes .6s linear infinite}
@keyframes stripes{to{background-position:28px 0}}
.plabels{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-1);font-size:24px;font-weight:600;color:var(--ink-muted)}.plabels .now{color:var(--ink)}

/* takeover */
.takeover{position:absolute;inset:0;background:var(--surface);display:grid;grid-template-rows:112px 1fr;z-index:10}
.tk-bar{display:flex;align-items:center;gap:var(--space-4);padding:0 var(--space-4);border-bottom:2px solid var(--line-strong)}
.back{height:var(--target-std);min-width:200px;border-radius:var(--radius-1);background:var(--action);color:var(--on-action);border:0;font:700 26px/1 var(--font-sans);text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
.back:active{opacity:.82}
.tk-body{padding:var(--space-4) var(--space-6);overflow:auto;-webkit-overflow-scrolling:touch}
.state{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.04em}
.state.pass{color:var(--pass-text)}.state.fail{color:var(--fail)}.state.check{color:var(--ink)}
.state .sq{width:14px;height:14px;background:var(--check);display:inline-block}

/* tables */
table.t{width:100%;border-collapse:collapse;font-size:22px}
table.t th{text-align:left;font-size:18px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);padding:0 var(--space-2) var(--space-1);border-bottom:2px solid var(--line-strong);height:48px}
table.t td{height:var(--row-h);padding:0 var(--space-2);border-bottom:1px solid var(--line)}
table.t .num{text-align:right}
table.t .name{font-weight:600}
tr.fail td{background:var(--fail-soft)}tr.noread td{background:var(--check-soft)}tr.inf td{color:var(--ink-muted)}
tr.tap{cursor:pointer}tr.tap:active td{background:var(--surface-3)}

/* overlays */
.scrim{position:absolute;inset:0;background:rgba(16,24,32,.55);z-index:20;display:flex;align-items:center;justify-content:center}
.sheet{background:var(--surface);min-width:760px;max-width:1100px;padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-3);border-radius:var(--radius-1)}
.sheet h2{font-size:40px;line-height:48px;margin:0}
.sheet .row{display:flex;gap:var(--space-3);justify-content:flex-end;margin-top:var(--space-2)}
.side{position:absolute;top:0;left:0;bottom:0;width:560px;background:var(--surface);padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-2);z-index:21}
.side .item{height:96px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:30px;font-weight:700;display:flex;align-items:center;gap:var(--space-3);padding:0 var(--space-2);cursor:pointer}
.side .item:active{background:var(--surface-3)}
.side .item small{display:block;font-size:18px;font-weight:500;color:var(--ink-muted)}
.side .item.on{box-shadow:inset 8px 0 0 var(--ink)}
.statuslist{display:grid;gap:0}
.srow{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:var(--space-2);height:88px;border-bottom:1px solid var(--line);font-size:24px}
.srow b{display:block}.srow small{font-size:18px;color:var(--ink-muted)}
.dot{width:24px;height:24px;border-radius:50%;background:var(--pass)}.dot.warn{background:var(--check)}.dot.down{background:var(--fail)}

/* keypad */
.readout{font:700 56px/72px var(--font-sans);border-bottom:3px solid var(--line-strong);padding:0 var(--space-1);min-width:480px;text-align:center;letter-spacing:.08em}
.keypad{display:grid;grid-template-columns:repeat(3,120px);gap:var(--space-2);justify-content:center}
.keypad.four{grid-template-columns:repeat(4,110px)}
.key{height:96px;border:2px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:var(--radius-1);font:700 34px/1 var(--font-sans);cursor:pointer}
.key:active{background:var(--surface-3);transform:translateY(2px)}
.key.fn{background:var(--surface-2);font-size:24px}
.key.ok{background:var(--action);color:var(--on-action);border-color:var(--action)}

/* segmented */
.seg-ctl{display:inline-flex;border:2px solid var(--line-strong);border-radius:var(--radius-1);overflow:hidden}
.seg-ctl button{min-height:var(--target-min);min-width:150px;padding:0 20px;border:0;background:var(--surface);font-size:22px;font-weight:700;cursor:pointer}
.seg-ctl button+button{border-left:2px solid var(--line-strong)}
.seg-ctl button.on{background:var(--ink);color:#fff}

/* manager & lists */
.page{padding:var(--space-6) var(--space-8);height:100%;display:flex;flex-direction:column;gap:var(--space-3);overflow:hidden}
.page-head{display:flex;align-items:center;gap:var(--space-3)}
.page-head h1{font-size:44px;line-height:52px;margin:0}
.scroll{overflow:auto;-webkit-overflow-scrolling:touch;min-height:0;flex:1}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-3)}
.tile{border:2px solid var(--line);padding:var(--space-3);display:flex;flex-direction:column;gap:var(--space-2);min-height:260px}
.tile h3{margin:0;font-size:28px}
.tile .big{font-size:48px;font-weight:700}
.tolbtn{min-height:var(--target-min);min-width:150px;border:2px solid var(--line-strong);background:var(--surface);border-radius:var(--radius-1);font-size:24px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.tolbtn:active{background:var(--surface-3)}
.tolbtn.edited{box-shadow:0 0 0 3px var(--focus)}
.stat{display:flex;gap:var(--space-6);font-size:22px;color:var(--ink-muted)}.stat b{display:block;font-size:48px;color:var(--ink)}

/* map */
.mapwrap{position:relative;height:100%;display:grid;grid-template-columns:1fr 360px;gap:var(--space-4)}
.mapcanvas{background:var(--surface-2);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.mapcanvas svg{transition:transform 150ms}
.maptools{display:flex;flex-direction:column;gap:var(--space-2)}
.legend{display:grid;gap:12px;font-size:20px;margin-top:var(--space-3)}
.legend span{display:inline-block;width:22px;height:22px;margin-right:10px;vertical-align:-4px}

/* toast */
.toast{position:absolute;left:50%;bottom:170px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:26px;font-weight:600;padding:22px 34px;border-radius:var(--radius-1);z-index:40;pointer-events:none;opacity:0;transition:opacity 150ms}
.toast.show{opacity:1}

/* demo panel */
.demo-fab{position:absolute;left:0;bottom:0;z-index:50;height:40px;padding:0 14px;background:#E4572E;color:#fff;border:0;font-size:15px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;opacity:.85}
.demo{position:absolute;left:16px;bottom:52px;z-index:50;background:#fff;border:3px solid #E4572E;padding:20px;display:flex;flex-direction:column;gap:14px;width:560px}
.demo h4{margin:0;font-size:20px;letter-spacing:.08em;text-transform:uppercase;color:#E4572E}
.demo .seg-ctl button{min-width:0;font-size:18px;min-height:56px}
.demo p{margin:0;font-size:16px;color:var(--ink-muted)}

/* splash */
.splash{position:absolute;inset:0;z-index:60;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-4);text-align:center}
.splash h1{font-size:120px;line-height:.92;font-weight:900;font-stretch:75%;text-transform:uppercase;margin:0}
.splash p{font-size:26px;color:var(--ink-muted);max-width:1100px;line-height:1.45;margin:0}
.hint{font-size:20px;color:var(--ink-subtle)}

/* ===== v2 touch sizing (preview) ===== */
/* top strip: same 80px height, bigger content */
.bar{gap:32px;padding:0 24px 0 0}
.bar .logo{height:45px}
.bar .station{font-size:33px}
.bar .role{font-size:24px}
.menu-btn{height:80px;min-width:220px;border:0;border-right:2px solid var(--line);border-radius:0;background:var(--surface);font-size:30px;gap:14px;padding:0 28px}
.menu-btn svg{width:36px;height:36px}
.chips{height:80px}
.chip{font-size:30px;height:64px;gap:12px}
.chip i{width:20px;height:20px}
/* bottom action buttons: twice as tall, same widths */
.right{grid-template-rows:minmax(0,1fr) auto}
.actions{padding-top:16px}
.actions .btn{min-height:208px;font-size:30px;padding:0 24px;min-width:220px}
.actions .btn.primary{min-height:208px;font-size:38px;min-width:360px}
/* results area: ~1.5x text */
.evidence{gap:18px;padding-top:64px;padding-bottom:8px;overflow-y:auto}
.title{font-size:66px;line-height:74px}
.body-lg{font-size:42px;line-height:54px}
.body-txt{font-size:32px;line-height:44px}
.num-lg{font-size:104px;line-height:92px}
.label{font-size:26px;line-height:32px}
.context{grid-template-columns:260px 1fr;row-gap:12px}
.context dt{font-size:26px}
.context dd{font-size:38px}
.callout{padding:22px 32px;gap:6px}
.callout .name{font-size:42px;line-height:50px}
.callout .dev{font-size:64px;line-height:72px}
.inferred{font-size:26px;height:52px;padding:0 16px;border-width:3px}
.inf-line{font-size:32px;gap:20px;flex-wrap:wrap}
.link{font-size:32px}
.why{font-size:28px;line-height:38px;padding:20px 24px}
.stat{font-size:30px}.stat b{font-size:72px}
.plabels{font-size:34px}
.seg{height:28px}

/* ===== v3 tweaks ===== */
.bar .logo{height:32px}
.bar .station{font-size:24px;font-weight:600;color:var(--ink-muted)}
.actions{gap:24px}
.actions .info{flex:1;margin-right:0;display:flex;gap:24px}
.actions .info:has(.btn + .btn) .btn{flex:1;min-width:0}
/* verdict drawer */
.body{transition:grid-template-columns 200ms ease}
.body.collapsed{grid-template-columns:176px minmax(0,1fr)}
.vwrap{position:relative;height:100%}
.verdict{transition:padding 200ms}
.collapsed .verdict{padding:24px 12px;gap:16px}
.collapsed .verdict svg{width:112px;height:112px}
.collapsed .verdict .word{font-size:52px}
.drawer-tab{position:absolute;right:0;top:50%;transform:translateY(-50%);z-index:4;width:72px;height:220px;border:0;border-radius:8px 0 0 8px;background:rgba(16,24,32,.18);color:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font:700 18px/1 var(--font-sans);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.drawer-tab svg{width:40px;height:40px}
.drawer-tab:active{background:rgba(16,24,32,.32)}
.collapsed .drawer-tab{right:0;width:100%;height:120px;top:auto;bottom:32px;transform:none;border-radius:0}
.verdict.fail .drawer-tab,.verdict.fail+.drawer-tab{color:#fff}
/* card carousel */
.carousel{display:grid;grid-template-columns:96px minmax(0,1fr) 96px;gap:16px;align-items:stretch}
.carousel .arrow{border:2px solid var(--line-strong);background:var(--surface);border-radius:var(--radius-1);font:700 44px/1 var(--font-sans);cursor:pointer;min-height:160px}
.carousel .arrow:active{background:var(--surface-3)}
.carousel .arrow[disabled]{border-color:var(--line);color:var(--line);cursor:default}
.cviewport{overflow:hidden;touch-action:pan-y}
.ctrack{display:flex;transition:transform 220ms ease}
.ctrack>.callout{flex:0 0 100%}
.dots{display:flex;gap:12px;justify-content:center;align-items:center;font-size:24px;color:var(--ink-muted);font-weight:600}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line);display:inline-block}
.dots i.on{background:var(--ink)}
/* collapsed detail view */
.cards-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.cards-row .callout{padding:20px 24px}
.cards-row .callout .name{font-size:32px;line-height:38px}
.cards-row .callout .dev{font-size:48px;line-height:56px}
.cards-row .callout .body-txt{font-size:24px;line-height:32px}
.detail-table table.t{font-size:26px}
.detail-table table.t td{height:60px}
.detail-head{display:flex;align-items:baseline;gap:24px}
.detail-head .num-lg{font-size:80px;line-height:80px}

.actions .btn{font-size:28px;padding:0 14px}
.actions .btn.primary{font-size:38px}
.drawer-tab{width:96px;height:260px;background:rgba(16,24,32,.30);font-size:20px;gap:14px}
.drawer-tab svg{width:52px;height:52px}
.drawer-tab:active{background:rgba(16,24,32,.45)}
.collapsed .drawer-tab{height:150px}
.carousel .arrow{font-size:0;display:flex;align-items:center;justify-content:center}
.carousel .arrow svg{width:48px;height:48px}

/* ===== v4: card nav options, motion, hover ===== */
:root{--ease-out:cubic-bezier(.2,.8,.2,1)}
.callout{background:var(--surface-3)}
.callout .name{color:var(--fail)}
.drawer-tab{font-size:22px;letter-spacing:.1em}
.body{transition:grid-template-columns 180ms var(--ease-out)}
.ctrack{transition:transform 180ms var(--ease-out)}
.evidence.fadeout{opacity:0;transition:opacity 90ms linear}
.evidence.fadein{animation:fadein 140ms linear}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.btn,.arrow,.ezone,.ftab,.drawer-tab,.menu-btn,.key,.back,.tolbtn{transition:transform 80ms var(--ease-out),background-color 120ms linear,opacity 80ms linear}
.btn:active,.btn.pressed,.arrow:active,.ezone:active,.ftab:active,.back:active,.key:active{transform:scale(.97)}
/* keep carousel parts from shrinking inside the evidence column */
.evidence>.cviewport,.evidence>.carousel,.evidence>.cnav,.evidence>.dots,.evidence>.ftabs,.evidence>.callout{flex-shrink:0}
/* bar below (default) */
.cnav{display:grid;grid-template-columns:140px 1fr 140px;gap:16px;align-items:center}
.cnav .arrow,.carousel.sidearrows .arrow{border:2px solid var(--line-strong);background:var(--surface);border-radius:var(--radius-1);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:0}
.cnav .arrow{height:96px}
.cnav .arrow svg,.carousel .arrow svg,.ezone svg{width:48px;height:48px}
.cnav .dots{justify-content:center}
.arrow[disabled]{border-color:var(--line)!important;color:var(--line);cursor:default;transform:none!important}
/* side */
.carousel.sidearrows{display:grid;grid-template-columns:96px minmax(0,1fr) 96px;gap:16px}
/* card edges */
.carousel.edge{position:relative;display:block}
.carousel.edge .callout{padding-left:112px;padding-right:112px}
.ezone{position:absolute;top:0;bottom:0;width:96px;border:0;background:rgba(16,24,32,.06);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ezone.prev{left:0}.ezone.next{right:0}
.ezone[disabled]{color:transparent;background:transparent;cursor:default}
/* name tabs */
.ftabs{display:flex;gap:12px;flex-wrap:wrap}
.ftab{min-height:72px;padding:0 20px;border:2px solid var(--line-strong);background:var(--surface);border-radius:var(--radius-1);font:700 24px/1.1 var(--font-sans);display:inline-flex;align-items:center;gap:10px;cursor:pointer;max-width:320px;text-align:left}
.ftab .x{color:var(--fail)}
.ftab.on{background:var(--ink);color:#fff}.ftab.on .x{color:#FF8A94}
/* mouse hover (only on devices that hover) */
@media (hover:hover){
 .btn.primary:hover,.back:hover,.key.ok:hover{background:#2A3542}
 .btn.secondary:hover,.menu-btn:hover,.tolbtn:hover,.key:hover,.cnav .arrow:not([disabled]):hover,.carousel.sidearrows .arrow:not([disabled]):hover,.ftab:not(.on):hover{background:var(--surface-2)}
 .btn.destructive:hover{background:var(--fail-soft)}
 .chips:hover{background:rgba(16,24,32,.05)}
 .drawer-tab:hover{background:rgba(16,24,32,.40)}
 .ezone:not([disabled]):hover{background:rgba(16,24,32,.12)}
 .link:hover{text-decoration-thickness:3px}
 tr.tap:hover td{background:var(--surface-2)}
 .side .item:hover{background:var(--surface-2)}
 .seg-ctl button:not(.on):hover{background:var(--surface-2)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ---------- formatting ---------- */
function gcd(a,b){return b?gcd(b,a%b):a}
function frac(x,den=32){const neg=x<0;x=Math.abs(x);let w=Math.floor(x+1e-9);let n=Math.round((x-w)*den);if(n===den){w++;n=0}
  let s='';if(n){const g=gcd(n,den);s=(n/g)+'/'+(den/g)}return {neg,w,s}}
function len(x){ // nominal / measured, feet-inches for >=12
  if(S.units==='mm') return (x*25.4).toFixed(1)+' mm';
  if(S.units==='dec') return x.toFixed(3)+' in';
  const f=frac(x);let ft=0,w=f.w;if(w>=12){ft=Math.floor(w/12);w=w%12}
  let inch=(w&&f.s)?w+'-'+f.s:(w?String(w):(f.s||'0'));
  return (ft?ft+"' ":'')+inch+'"';}
function dev(x){ // signed deviation
  if(S.units==='mm'){const v=x*25.4;return (Math.abs(v)<.005?'0.00':(v>0?'+':'−')+Math.abs(v).toFixed(2))+' mm'}
  if(S.units==='dec'){return (Math.abs(x)<.0005?'0.000':(x>0?'+':'−')+Math.abs(x).toFixed(3))+' in'}
  const f=frac(x);if(!f.w&&!f.s)return '0"';const body=f.w?(f.s?f.w+'-'+f.s:f.w):f.s;return (x>0?'+':'−')+body+'"';}
function tolf(t){if(S.units==='mm')return '±'+(t*25.4).toFixed(2)+' mm';if(S.units==='dec')return '±'+t.toFixed(3)+' in';const f=frac(t,64);return '±'+(f.w?f.w+(f.s?'-'+f.s:''):f.s)+'"'}

/* ---------- scan simulation ---------- */
function simulate(){
  let out=S.force;
  if(S.camShift) out='check';
  if(out==='auto'){const r=Math.random();out=r<.72?'pass':r<.88?'fail':'check';}
  const p=part(),t=tpl(p.family);
  const q=1/32;
  const feats=t.features.map(f=>{const d=Math.round((Math.random()*1.4-.7)*(f.tol/q))*q;return {...f,meas:f.nom+d,dev:d,state:'pass'}});
  let cause=null;
  if(out==='fail3'){[3,0,4].forEach(i=>{const f=feats[i];const over=f.tol+q*(1+Math.floor(Math.random()*2));f.dev=(Math.random()<.5?1:-1)*over;f.meas=f.nom+f.dev;f.state='fail'});out='fail';}
  else if(out==='fail'){const i=Math.random()<.5?3:Math.floor(Math.random()*feats.length);const f=feats[i];const over=f.tol+q*(1+Math.floor(Math.random()*2));f.dev=(Math.random()<.5?1:-1)*over;f.meas=f.nom+f.dev;f.state='fail';}
  if(out==='check'){cause=S.camShift?'cam':['edge','reg','edge','unknown'][Math.floor(Math.random()*4)];}
  const inf=t.inferred.map(f=>({...f,meas:f.nom}));
  const res={out,feats,inf,cause,part:p,time:new Date(),id:'SC-'+(10480+S.history.length+S.counts.pass+S.counts.fail+S.counts.check)};
  S.counts[out]++;S.history.unshift(res);return res;
}
// seed history
(function(){for(let i=7;i>=0;i--){const save=S.force;S.force=['pass','pass','fail','pass','check','pass','pass','pass'][i];S.pi=i;const r=simulate();r.time=new Date(Date.now()-(i+1)*6.5*60000);S.counts[r.out]--;S.force=save}S.pi=0;})();

function failCard(f){return `<div class="callout"><span class="label">Out of tolerance</span><span class="name">${f.n}</span><span class="dev">${dev(Math.abs(f.dev)-f.tol).replace('+','')} ${f.dev>0?'over':'under'} limit</span><span class="body-txt">Measured ${len(f.meas)} · nominal ${len(f.nom)} · tol ${tolf(f.tol)}</span></div>`}
function carousel(cards,names){
  if(cards.length===1) return cards[0];

  const next=`<button class="arrow next" data-a="cnext"${i===n-1?' disabled':''} aria-label="Next">${CHEV_R}</button>`;
  if(v==='side') return `<div class="carousel sidearrows">${prev}${track}${next}</div>${dots}`;
  if(v==='tabs') return `<div class="ftabs">${names.map((nm,k)=>`<button class="ftab${k===i?' on':''}" data-a="cgo" data-v="${k}"><span class="x">✕</span>${nm}</button>`).join('')}</div>${track}`;

const CHEV_L='<svg viewBox="0 0 40 40" fill="none"><path d="M26 6L12 20l14 14" stroke="currentColor" stroke-width="5"/></svg>';

function vResult(){
  const r=S.result,p=r.part;
  const word={pass:'Pass',fail:'Fail',check:'Check'}[r.out],icon={pass:IC.check,fail:IC.x,check:IC.warn}[r.out];
  const bad=r.feats.filter(f=>f.state==='fail');
  let ev='';
  if(S.drawer && r.out!=='check'){
    // detail view: more room
    const head=r.out==='pass'?`<div class="detail-head"><div class="num-lg">${r.feats.length} of ${r.feats.length}</div><p class="body-lg">features in tolerance</p></div>`:`<div class="detail-head"><div class="num-lg">${bad.length} of ${r.feats.length}</div><p class="body-lg">feature${bad.length>1?'s':''} out of tolerance</p></div>`;
    ev=head+(bad.length?`<div class="cards-row">${bad.slice(0,3).map(failCard).join('')}</div>`:'')+`<div class="detail-table">${measTable(r)}</div>`;
  } else if(r.out==='pass'){
    ev=`<div class="num-lg">${r.feats.length} of ${r.feats.length}</div><p class="body-lg">features in tolerance</p>`;
    if(r.inf.length) ev+=`<div class="inf-line"><span class="inferred">Inferred</span>${r.inf.length} more estimated from CAD, not in PASS/FAIL. <button class="link" data-a="why">${S.why?'Hide':'Why?'}</button></div>`+(S.why?`<div class="why">Filleted edges curve away from the camera, so the last few millimetres of the edge can't be seen. Toggle projects the edge from the CAD model. These values are shown for reference and never decide PASS or FAIL.</div>`:'');
  } else if(r.out==='fail'){
    ev=`<div class="num-lg">${bad.length} of ${r.feats.length}</div><p class="body-lg">feature${bad.length>1?'s':''} out of tolerance</p>`+carousel(bad.map(failCard),bad.map(f=>f.n));
  } else {
    const c=CHECKS[r.cause];
    ev=`<span class="label">No result yet · next step needed</span><h1 class="title">${c.title}</h1><p class="body-lg">${c.fix}</p><p class="body-txt">Still showing CHECK after 2 tries? Call your QC lead.</p>`;
  }
  let acts='';

  if(r.out==='check') acts=r.cause==='unknown'?`<div class="info"><button class="btn secondary" data-a="rescan">Rescan</button></div><button class="btn primary" data-a="next">Skip part</button>`:`<div class="info"><button class="btn secondary" data-a="next">Skip part</button></div><button class="btn primary" data-a="rescan">Rescan</button>`;
  const tab=r.out==='check'?'':`<button class="drawer-tab" data-a="drawer" aria-label="${S.drawer?'Show less':'Show more'}">${S.drawer?CHEV_R:CHEV_L}<span>${S.drawer?'Less':'More'}</span></button>`;
  return `<div class="body${S.drawer?' collapsed':''}"><div class="vwrap"><div class="verdict ${r.out}">${icon}<p class="word">${word}</p></div>${tab}</div>

function measTable(r){

  else if(S.screen==='mgr')h=S.mgrTpl==null?vMgrList():vMgrTpl();
  else if(S.screen==='history')h=vHistory();
  else if(S.screen==='diag')h=vDiag();
  if(S.takeover==='meas')h+=vMeas(S.tkResult||S.result,S.tkTitle);
  if(S.takeover==='map')h+=vMap(S.result);
  const ov={menu:oMenu,status:oStatus,pin:oPin,tol:oTol,recal:oRecal}[S.overlay];
  if(ov)h+=ov();else if(S.overlay==='confirm')h+=ovHTML;
  h+=demoHTML();
  $view.innerHTML=h;
}
let demoOpen=false;
function demoHTML(){
  const b=(v,l)=>`<button class="${S.force===v?'on':''}" data-a="force" data-v="${v}">${l}</button>`;
  return `<button class="demo-fab" data-a="demo">Demo</button>`+(demoOpen?`<div class="demo" data-stop><h4>Prototype controls</h4><p>Next scan result</p>
  <div class="seg-ctl">${b('auto','Random')}${b('pass','Pass')}${b('fail','Fail')}${b('fail3','Fail ×3')}${b('check','Check')}</div>
  <div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn secondary sm" data-a="shift">${S.camShift?'Clear':'Simulate'} camera shift</button><button class="btn secondary sm" data-a="toggleerp">${S.erpDown?'Restore':'Drop'} ERP</button><button class="btn secondary sm" data-a="fs">Full screen</button></div></div>`:'');
}

/* in-place carousel move (keeps the slide animation) */
function go2(k){const n=S.result?S.result.feats.filter(f=>f.state==='fail').length:1;k=Math.max(0,Math.min(n-1,k));if(k===S.ci)return;S.ci=k;
  const t=document.querySelector('.ctrack');if(!t){render();return}
  t.style.transform=`translateX(-${k*100}%)`;
  document.querySelectorAll('.dots i').forEach((d,j)=>d.classList.toggle('on',j===k));
  const c=document.querySelector('.dots .count');if(c)c.textContent=`${k+1} of ${n}`;
  document.querySelectorAll('[data-a=cprev]').forEach(b=>b.toggleAttribute('disabled',k===0));
  document.querySelectorAll('[data-a=cnext]').forEach(b=>b.toggleAttribute('disabled',k===n-1));
  document.querySelectorAll('.ftab').forEach((b,j)=>b.classList.toggle('on',j===k));}
/* ---------- toast ---------- */
let tt;function toast(msg){let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';$stage.appendChild(el)}el.textContent=msg;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2400)}

/* ---------- actions ---------- */
function go(screen){S.screen=screen;S.takeover=null;S.overlay=null;S.why=false;render()}
function startScan(){
  clearTimeout(scanTimer);S.screen='scanning';S.scanStage=0;S.takeover=null;S.why=false;render();
  const step=(n,ms)=>{scanTimer=setTimeout(()=>{if(S.screen!=='scanning')return;if(n<3){S.scanStage=n;render();step(n+1,n===1?1300:500)}else{S.result=simulate();S.ci=0;S.drawer=false;S.screen='result';render();buzz(S.result.out)}},ms)};
  step(1,1400);
}
function buzz(out){if(navigator.vibrate)navigator.vibrate(out==='pass'?40:out==='fail'?[60,60,60]:[40,40,40,40,40])}
const A={
  menu(){S.overlay='menu';render()},
  status(){S.overlay='status';render()},
  closeov(){S.overlay=null;render()},
  scan(){startScan()},
  rescan(){startScan()},
  cancelscan(){clearTimeout(scanTimer);go('ready');toast('Scan cancelled')},
  next(){S.pi++;S.result=null;go('ready')},
  setaside(){ovHTML=oConfirm('Set this part aside?','Put the failed part on the red rack before scanning the next one.','next','Part is set aside');S.overlay='confirm';render()},
  wrongpart(){ovHTML=oConfirm('Part doesn\'t match?','The ERP sent <span class="mono">'+part().pn+'</span>. If the part on the table is different, skip it and tell your QC lead.','next','Skip this part');S.overlay='confirm';render()},
  why(){S.why=!S.why;render()},
  meas(){S.takeover='meas';S.tkResult=null;S.tkTitle=null;render()},
  map(){S.takeover='map';S.mapZoom=1;render()},
  closetk(){S.takeover=null;S.tkResult=null;render()},
  u(v){S.units=v;render()},
  zin(){S.mapZoom=Math.min(2.2,S.mapZoom+.3);render()},zout(){S.mapZoom=Math.max(.6,S.mapZoom-.3);render()},zreset(){S.mapZoom=1;render()},
  'go-scan'(){S.screen=S.result&&S.screen==='result'?'result':'ready';go(S.screen)},
  'go-history'(){go('history')},
  'go-diag'(){go('diag')},
  'go-mgr'(){if(S.role==='manager'){S.mgrTpl=null;go('mgr')}else{pin='';S.overlay='pin';render()}},
  pk(v){pin+=v;if(pin.length>=4){S.role='manager';S.mgrTpl=null;S.overlay=null;S.screen='mgr';render();toast('Signed in as manager')}else render()},
  pkdel(){pin=pin.slice(0,-1);render()},
  signout(){S.role='operator';go('ready');toast('Signed out')},
  restart(){location.reload()},
  opentpl(v){S.mgrTpl=+v;S.dirty=false;render()},
  mgrback(){if(S.dirty){ovHTML=oConfirm('Leave without publishing?','Your tolerance changes will be lost.','discardleave','Discard and leave',true);S.overlay='confirm';render()}else{S.mgrTpl=null;render()}},
  discardleave(){TEMPLATES[S.mgrTpl].features.forEach(f=>{if(f.orig!=null){f.tol=f.orig;delete f.orig;delete f.edited}});S.dirty=false;S.mgrTpl=null;S.overlay=null;render()},
  tu(v){TEMPLATES[S.mgrTpl].units=v;S.dirty=true;render()},
  tol(v){S.tolEdit=+v;tolBuf='';S.overlay='tol';render()},
  tk(v){if(tolBuf.length<8)tolBuf+=v;render()},
  'tk-del'(){tolBuf=tolBuf.slice(0,-1);render()},
  'tk-ok'(){const t=TEMPLATES[S.mgrTpl],f=t.features[S.tolEdit];let val=null;
    if(tolBuf.includes('/')){const [a,b]=tolBuf.split('/').map(Number);if(a&&b)val=a/b}else if(tolBuf){val=parseFloat(tolBuf);if(t.units==='mm')val=val/25.4}
    if(val&&val>0&&val<2){if(f.orig==null)f.orig=f.tol;f.tol=val;f.edited=true;S.dirty=true;S.overlay=null;render();toast('Tolerance updated')}else{toast('Enter a value like 1/8 or 0.125')}},
  discard(){ovHTML=oConfirm('Discard changes?','Tolerances go back to v'+TEMPLATES[S.mgrTpl].ver+'.','discardok','Discard',true);S.overlay='confirm';render()},
  discardok(){TEMPLATES[S.mgrTpl].features.forEach(f=>{if(f.orig!=null){f.tol=f.orig;delete f.orig;delete f.edited}});S.dirty=false;S.overlay=null;render();toast('Changes discarded')},
  trial(){toast('Trial scan: place a known-good part (mock)')},
  publish(){const t=TEMPLATES[S.mgrTpl];ovHTML=oConfirm('Publish v'+(t.ver+1)+'?','Station 1 will use the new tolerances on the next scan of '+t.name+'.','publishok','Publish');S.overlay='confirm';render()},
  publishok(){const t=TEMPLATES[S.mgrTpl];t.ver++;t.edited='just now · you';t.features.forEach(f=>{delete f.orig;delete f.edited});S.dirty=false;S.overlay=null;render();toast('Published v'+t.ver+' to Station 1')},
  hf(v){S.histFilter=v;render()},
  histopen(v){const r=S.history[+v];S.takeover='meas';S.tkResult=r;S.tkTitle='Scan '+r.id;render()},
  testcam(){S.diag='testcam';render();setTimeout(()=>{S.diag=null;render();toast(S.camShift?'Camera responds, but position has shifted':'Camera OK · 24 fps · exposure normal')},1500)},
  recal(){recalStep=0;S.overlay='recal';render()},
  'recal-next'(){recalStep=1;render();setTimeout(()=>{recalStep=2;render()},2000)},
  'recal-done'(){S.camShift=false;S.overlay=null;render();toast('Calibration saved')},
  shift(){S.camShift=!S.camShift;render();toast(S.camShift?'Camera shift simulated: next scan shows CHECK':'Camera shift cleared')},
  toggleerp(){S.erpDown=!S.erpDown;render();toast(S.erpDown?'ERP offline: results will queue':'ERP connected')},
  force(v){S.force=v;render()},
  nav(v){S.nav=v;render()},
  cprev(){go2(S.ci-1)},
  cgo(v){go2(+v)},
  cnext(){go2(S.ci+1)},
  drawer(){const b=document.querySelector('.body');if(!b){S.drawer=!S.drawer;render();return}
    S.drawer=!S.drawer;const ev=document.querySelector('.evidence');if(ev)ev.classList.add('fadeout');
    b.classList.toggle('collapsed',S.drawer);setTimeout(()=>{render();const e2=document.querySelector('.evidence');if(e2)e2.classList.add('fadein')},190)},
  demo(){demoOpen=!demoOpen;render()},
  fs(){const d=document.documentElement;(d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d)},
  toast(v){toast(v)},
  discardleave2(){},
};
/* pointer handling: instant pressed state + action on release */
let downEl=null;
$stage.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-a]');if(!el)return;downEl=el;el.classList.add('pressed')});
addEventListener('pointerup',()=>{if(downEl){downEl.classList.remove('pressed');downEl=null}});
addEventListener('pointercancel',()=>{if(downEl){downEl.classList.remove('pressed');downEl=null}});
$stage.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  if(el.classList.contains('scrim')&&e.target!==el)return; // taps inside sheet
  if(el.hasAttribute('disabled'))return;
  const a=el.dataset.a;if(A[a])A[a](el.dataset.v);
});
let sx=null;
$stage.addEventListener('pointerdown',e=>{if(e.target.closest('#cvp'))sx=e.clientX});
$stage.addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>60){dx<0?A.cnext():A.cprev()}});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ---------- splash ---------- */
const sp=document.createElement('div');sp.className='splash';
sp.innerHTML=`<img src="${LOGO}" style="height:64px"><h1>Toggle QC Station</h1><p>Clickable prototype of the operator touchscreen. Tap SCAN to run a part, then explore the results, the Menu (history, templates, diagnostics) and the status chips in the top bar.</p>
<div style="display:flex;gap:24px"><button class="btn primary" id="go-fs">Start full screen</button><button class="btn secondary" id="go-win" style="min-height:112px">Start in window</button></div>
<p class="hint">The orange DEMO tab (bottom-left) forces the next result. Manager PIN is any 4 digits. Nothing here talks to a real station.</p>`;
$stage.appendChild(sp);
sp.querySelector('#go-fs').onclick=()=>{A.fs();sp.remove()};
sp.querySelector('#go-win').onclick=()=>sp.remove();
render();
})();
</script>
</body>
</html>
